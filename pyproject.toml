[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lic-hpcm"
version = "0.0.1"
description = "Learned Image Compression with Hierarchical Progressive Context Modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["compressai>=1.2.0", "pytorch-msssim", "torchvision", "einops", "scipy", "torchao"]

[project.optional-dependencies]
train = ["tqdm", "tensorboard"]

[tool.setuptools]
packages = [
    "lic_hpcm",
    "lic_hpcm.models",
    "lic_hpcm.layers",
    "lic_hpcm.entropy_models",
]
package-dir = { lic_hpcm = "src" }
